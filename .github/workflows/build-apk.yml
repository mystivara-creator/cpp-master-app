name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Secrets & Environment
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace -Djava.awt.headless=true

      - name: Rename APK for Direct Download
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/CppMaster.apk

      - name: Publish Direct APK to GitHub Releases (Tanpa ZIP)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          gh release create "$TAG_NAME" release-output/CppMaster.apk \
            --title "C++ Master APK (Build #${{ github.run_number }})" \
            --notes "File APK langsung (bukan ZIP). Ketuk CppMaster.apk di bawah untuk langsung menginstall di HP Anda!" \
            --generate-notes=false || echo "Release already exists or skipped"

      - name: Upload APK Artifact (Cadangan)
        uses: actions/upload-artifact@v4
        with:
          name: CppMaster-Direct-APK
          path: release-output/CppMaster.apk
          if-no-files-found: error
