name: Build Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare Secrets & Environment
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env
          fi
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "app/google-services.json" ]; then
            cat << 'EOF' > app/google-services.json
{
  "project_info": {
    "project_number": "605804267927",
    "project_id": "gen-lang-client-0359939422",
    "storage_bucket": "gen-lang-client-0359939422.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:605804267927:android:971667ab533a515a5c5cd2",
        "android_client_info": {
          "package_name": "com.aistudio.cppmaster.vpkznx"
        }
      },
      "oauth_client": [
        {
          "client_id": "605804267927-ldtnj6sh0a6lt9utjte0vgoq7s8q0fkc.apps.googleusercontent.com",
          "client_type": 1,
          "android_info": {
            "package_name": "com.aistudio.cppmaster.vpkznx",
            "certificate_hash": "0394289c0909861b517d98a1fa6d7ab2d58d8693"
          }
        },
        {
          "client_id": "605804267927-fosdqf36bc97mufno5pb5ovn1k21bpkd.apps.googleusercontent.com",
          "client_type": 3
        }
      ],
      "api_key": [
        {
          "current_key": "AIzaSyCjPmsZysI0RyZFjlxi6Z9TWqis44-vTzM"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": [
            {
              "client_id": "605804267927-fosdqf36bc97mufno5pb5ovn1k21bpkd.apps.googleusercontent.com",
              "client_type": 3
            }
          ]
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
          fi
          chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace -Djava.awt.headless=true

      - name: Rename APK for Direct Download
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/debug/app-debug.apk release-output/CppMaster.apk

      - name: Publish Direct APK to GitHub Releases (Tanpa ZIP)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          gh release create "$TAG_NAME" release-output/CppMaster.apk \
            --title "C++ Master APK (Build #${{ github.run_number }})" \
            --notes "File APK langsung (bukan ZIP). Ketuk CppMaster.apk di bawah untuk langsung menginstall di HP Anda!" \
            --generate-notes=false || echo "Release already exists or skipped"

      - name: Upload APK Artifact (Cadangan)
        uses: actions/upload-artifact@v4
        with:
          name: CppMaster-Direct-APK
          path: release-output/CppMaster.apk
          if-no-files-found: error
